<script>
  // Mark the link for the current page. Works with or without ".html".
  (() => {
    const bare = (name) => name.replace(/\.html$/, "");
    const page = bare(location.pathname.split("/").pop() || "index");
    document.querySelectorAll("header nav a").forEach((link) => {
      if (bare(link.getAttribute("href")) === page) link.classList.add("active");
    });
  })();
</script>
