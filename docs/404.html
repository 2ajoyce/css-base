<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="../css-base/index.css" />
    <script src="../css-base/theme-switcher.js"></script>
  </head>
  <body>
    <header>
      <h1>404 - Page Not Found</h1>
      <include-html src="partials/nav.html" style="display: contents">
<nav
  class="columns"
  style="background-color: var(--background-color); padding: 1em"
>
  <a href="index.html">Home</a>
  <a href="elements.html">Elements</a>
  <a href="utility.html">Utility</a>
  <a href="layout.html">Layout</a>
  <a href="components.html">Components</a>
  <div class="stack horizontal" style="--stack-space: 0; --stack-wrap: nowrap">
    <label for="theme-select" class="left ground">Theme:</label>
    <select id="theme-select">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="high-contrast">High Contrast</option>
    </select>
  </div>
</nav>
<script>
  // Mark the link for the current page. Works with or without ".html".
  (() => {
    const bare = (name) => name.replace(/\.html$/, "");
    const page = bare(location.pathname.split("/").pop() || "index");
    document.querySelectorAll("header nav a").forEach((link) => {
      if (bare(link.getAttribute("href")) === page) link.classList.add("active");
    });
  })();
</script>
</include-html>
    </header>
    <section>
      <p>Sorry, the page you are looking for does not exist.</p>
      <p>
        You can return to the <a href="index.html">home page</a> or use the
        navigation menu to explore other sections.
      </p>
    </section>
    <include-html src="partials/footer.html" style="display: contents">
<footer>
  <p>Created by <a href="https://github.com/2ajoyce/css-base">2ajoyce</a></p>
</footer>
</include-html>
  </body>
</html>
