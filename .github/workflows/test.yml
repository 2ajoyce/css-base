name: Test

on:
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  test:
    name: Tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --test
