name: Release

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: simple

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: ${{ steps.release.outputs.release_created }}

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        if: ${{ steps.release.outputs.release_created }}

      - name: Build
        run: just build-ci
        if: ${{ steps.release.outputs.release_created }}

      - name: Upload Release Asset
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET_PATH=$(ls css-base_*.zip)
          gh release upload ${{ steps.release.outputs.tag_name }} "$ASSET_PATH"

      - name: Prepare Pages Site
        if: ${{ steps.release.outputs.release_created }}
        run: |
          mkdir _site
          cp -r docs/* _site/
          cp -r css-base _site/css-base
          # Replace relative parent links (../css-base) with local links (css-base)
          sed -i 's|\.\./css-base|css-base|g' _site/*.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ steps.release.outputs.release_created }}
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        if: ${{ steps.release.outputs.release_created }}
