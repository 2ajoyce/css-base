name: Check Catalog

on:
  pull_request:
    paths:
      - "css-base/**"
      - ".github/workflows/check-catalog.yml"

permissions:
  contents: read

jobs:
  contexts:
    name: Context blocks match file contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node css-base/catalog.mjs contexts

  agents:
    name: AGENTS.md matches file headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node css-base/catalog.mjs agents
